    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
        }

        .night {
            position: fixed;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            filter: blur(0.1vmin);
            z-index: 0;
            background-image: radial-gradient(ellipse at top, transparent 0%, var(--dark-color)), radial-gradient(ellipse at bottom, var(--dark-color), rgba(145, 233, 255, 0.2)), repeating-linear-gradient(220deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px), repeating-linear-gradient(189deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px), repeating-linear-gradient(148deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px), linear-gradient(90deg, rgb(255, 250, 250), rgb(240, 240, 240));
        }

        .slider-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            overflow: hidden;
            text-align: center;
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            width: 100%;
            opacity: 0.8;
            border-radius: 10px;
        }

        .text {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            opacity: 0;
            display: inline-block;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 10px white, 0 0 20px white;
            letter-spacing: 5px;
            position: relative;
        }

        .text::after {
            content: '|';
            display: inline-block;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .dots {
            text-align: center;
            margin-top: 10px;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin: 5px;
            background-color: #bbb;
            border-radius: 50%;
            cursor: pointer;
        }

        .active {
            background-color: #fff;
        }

        .hidden-button {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #000;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            text-decoration: none;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden-button:hover {
            opacity: 1;
        }

        .next-button {
            margin-top: 20px;
            padding: 10px 20px;
            background: pink;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.5);
            transition: transform 0.2s ease-in-out;
            z-index: 999;

        }

        .next-button:hover {
            transform: scale(1.1);
            background: #ff69b4;
        }

        .link {
            color: #ff66b2;
            /* Warna pink */
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
        }

        .link:hover {
            text-decoration: underline;
            color: #ff3385;
            /* Warna pink lebih gelap saat hover */
        }
    </style>
    <title>Rani Sayang</title>
</head>

    ];

    function showText(index) {
        let textElement = slides[index].querySelector('.text');
        textElement.innerHTML = ''; // Kosongkan teks sebelumnya
        textElement.style.opacity = 1;

        let text = texts[index]; // Ambil teks langsung (tidak dipecah karakter)

        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                textElement.innerHTML = text.substring(0, i + 1); // Tambah karakter satu per satu
                i++;
                setTimeout(typeWriter, 120); // Kecepatan mengetik (bisa disesuaikan)
            }
        }
        typeWriter();
    }
    function nextSlide() {
        slideIndex = (slideIndex + 1) % slides.length;
        document.querySelector('.slides').style.transform = `translateX(-${slideIndex * 100}%)`;
        showText(slideIndex);
    }

    showText(slideIndex);

</script>
